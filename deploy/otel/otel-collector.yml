# Pi platform - S1 OTel Collector（实验配置）
# 手册 §4.3：接收 OTLP/gRPC + OTLP/HTTP；debug + file 双出口；130 秒批处理。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 100
  file:
    path: /logs/otel-events.json
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 5

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file]